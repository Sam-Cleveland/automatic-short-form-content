# Default pipeline configuration.
# Override with `shortform --config path/to/custom.yaml`.

# Backend selection — one of the registered adapters in each category.
backends:
  source: reddit
  tts: kokoro          # kokoro | edge_tts | coqui | elevenlabs
  transcribe: whisper_local   # whisper_local | whisper_api

# Paths (relative to project root unless absolute)
paths:
  stock_dir: stock
  output_dir: output
  resources_dir: .     # flat layout currently; assets live at repo root

# Assets used by the title card renderer
assets:
  title_font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  caption_font: Bangers-Regular.ttf
  user_overlay: user.png
  likes_comments_overlay: likes_comments.png
  pfp_overlay: pfp.png
  awards_overlay: awards.png

# TTS (Kokoro local) config — fast CPU-based ONNX, no GPU required
# Voices: bm_george (British male), am_michael (US male), af_bella/af_heart (US female)
#         bf_emma/bf_isabella (British female), am_adam (US male, deeper)
tts_kokoro:
  voice: bm_george
  speed: 1.0
  lang: en-us
  model_repo: fastrtc/kokoro-onnx

# TTS (Edge TTS cloud) config — Microsoft neural voices, requires internet
# Voices: en-GB-RyanNeural, en-US-GuyNeural, en-US-AriaNeural, en-US-JennyNeural
tts_edge:
  voice: en-GB-RyanNeural

# TTS (Coqui local) config
# speaker: built-in XTTS v2 voice name — takes priority over speaker_wav when set.
#   speaker_wav requires 6–30s of clean speech; shorter files produce garbled audio.
#   Built-in options (no reference file needed): Claribel Dervla, Daisy Studious,
#   Gracie Wise, Craig Gutsy, Damien Black, Viktor Eka, Nova Hogarth, Badr Odhiambo
tts_coqui:
  model: tts_models/multilingual/multi-dataset/xtts_v2
  speaker_wav: en_uk_003.mp3
  speaker: "Craig Gutsy"
  language: en

# TTS (ElevenLabs cloud) config
tts_elevenlabs:
  voice_id: ""        # set in .env or here
  model: eleven_multilingual_v2
  stability: 0.5
  similarity_boost: 0.75

# Transcription (Whisper local) config
transcribe_whisper_local:
  model_id: openai/whisper-small
  chunk_length_s: 30
  batch_size: 16

# Transcription (OpenAI API) config
transcribe_whisper_api:
  model: whisper-1

# Video output
video:
  width: 720
  height: 720
  fps: 60
  audio_codec: aac
  video_codec: libx264

# Batch behavior
batch:
  skip_if_exists: true
  max_retries: 3
  retry_backoff_seconds: 2
